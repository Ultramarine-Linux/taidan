[workspace]
members = ["taidan_proc_macros", "libtaidan", "tdnx"]

[workspace.dependencies]
futures = "0.3.32"
itertools = "0.15.0"
libtaidan = { path = "./libtaidan" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.140"
tempfile = { version = "3.20.0", default-features = false }
tracing = "0.1.44"

[workspace.dependencies.tracing-subscriber]
version = "0.3.23"
features = ["env-filter", "tracing-log"]

[workspace.dependencies.tokio]
version = "1.46.1"
features = ["fs", "io-util", "macros", "process"]


[package]
name = "taidan"
version = "0.2.7"
edition = "2024"
description = "Out-Of-Box-Experience (OOBE) and Welcome App"
license = "GPL-3.0-or-later"
repository = "https://github.com/Ultramarine-Linux/taidan"
readme = "README.md"
keywords = ["oobe", "ultramarine", "linux"]
build = "build.rs"

[dependencies]
atomic_float = "1.1.0"
basic-toml = "0.1.10"
color-eyre = "0.6.5"
const_format = "0.2.36"
enum_dispatch = "0.3.13"
fluent = "0.17.0"
futures = { workspace = true }
hex = "0.4.3"
i18n-embed = { version = "0.16.0", features = [
    "desktop-requester",
    "filesystem-assets",
    "fluent-system",
] }
i18n-embed-fl = "0.10.1"
icu = { version = "2.3.1", features = ["unstable"] }
# decodes the welcome image off the UI thread, and gives Slint's `@image-url` the `webp` decoder
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
iso3166 = "1.2.1"
isolang = { version = "2.4.0", features = ["local_names"] }
itertools = { workspace = true }
libc = "0.2.189"
libtaidan = { version = "0.3.0", path = "libtaidan" }
memchr = "2.7.5"
parking_lot = "0.13.0"
paste = "1.0.15"
phf = { version = "0.14.0", features = ["macros"] }
poly_l10n = "0.0.7"
regex = { workspace = true }
reqwest = { version = "0.13.4", features = [
    "http2",
    "default-tls",
], default-features = false }
rust-embed = { version = "8.7.2", features = ["include-exclude"] }
# NOTE: current tree requires this version too?
# sentry = { version = "0.46.2", features = ["logs", "tracing"] }
sentry = { version = "0.49.2", features = ["logs", "tracing"] }
sentry-eyre = "0.3.0"
serde = "1.0.219"
serde_json = "1.0.140"
slint = "1.18.1"
strip-ansi-escapes = "0.2.1"
taidan_proc_macros = { path = "taidan_proc_macros" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
tracing = { workspace = true }
tracing-appender = "0.2.3"
tracing-error = "0.2.1"
tracing-journald = "0.3.1"
tracing-subscriber = { workspace = true }
uzers = "0.12.1"
v4l = "0.14.0"
which = { version = "8.0.6", features = ["tracing"] }
xcb = { version = "1.7.1", features = ["randr"] }
xcrypt = "0.3.2"

[build-dependencies]
slint-build = "1.18.1"

[lints.clippy]
# cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

disallowed_macros = "deny"
excessive_nesting = "warn"

# arithmetic_side_effects = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
create_dir = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
field_scoped_visibility_modifiers = "deny"
format_push_string = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
impl_trait_in_params = "warn"
# indexing_slicing = "warn"
infinite_loop = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "warn"
# multiple_inherent_impl = "warn"
needless_raw_strings = "warn"
rc_buffer = "warn"
rc_mutex = "deny"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
rest_pat_in_fully_bound_structs = "warn"
semicolon_outside_block = "warn"
str_to_string = "warn"
string_lit_chars_any = "warn"
tests_outside_test_module = "warn"
todo = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "deny"
unimplemented = "warn"
unneeded_field_pattern = "warn"
unwrap_in_result = "warn"
needless_for_each = "allow"

# Optimize only the crates doing per-frame work (rendering, text, images) in dev builds,
# so the UI is usable without paying to optimize every dependency.
[profile.dev.package."i-slint-core"]
opt-level = 3
[profile.dev.package."i-slint-backend-winit"]
opt-level = 3
[profile.dev.package."i-slint-renderer-femtovg"]
opt-level = 3
[profile.dev.package."i-slint-renderer-software"]
opt-level = 3
[profile.dev.package.femtovg]
opt-level = 3
[profile.dev.package.lyon_geom]
opt-level = 3
[profile.dev.package.lyon_path]
opt-level = 3
[profile.dev.package.lyon_algorithms]
opt-level = 3
[profile.dev.package.kurbo]
opt-level = 3
[profile.dev.package.parley]
opt-level = 3
[profile.dev.package.fontique]
opt-level = 3
[profile.dev.package.harfrust]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package."read-fonts"]
opt-level = 3
[profile.dev.package.swash]
opt-level = 3
[profile.dev.package.zeno]
opt-level = 3
[profile.dev.package."ttf-parser"]
opt-level = 3
[profile.dev.package.icu_segmenter]
opt-level = 3
[profile.dev.package.resvg]
opt-level = 3
[profile.dev.package.usvg]
opt-level = 3
[profile.dev.package."tiny-skia"]
opt-level = 3
[profile.dev.package."tiny-skia-path"]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package."zune-jpeg"]
opt-level = 3
