version: 2

multi-ecosystem-groups:
  actions:
    schedule:
      interval: "weekly"
  npm:
    schedule:
      interval: "weekly"

updates:
  # Keep GitHub Actions updates in the shared repository dependency group.
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: actions

  # Keep the optional server-oobe npm updates in the same group.
  - package-ecosystem: "npm"
    directory: "/server-oobe"
    patterns:
      - "*"
    multi-ecosystem-group: npm
