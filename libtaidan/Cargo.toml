[package]
name = "libtaidan"
version = "0.3.0"
edition = "2024"
description = "Backend for Taidan (OOBE Application for Ultramarine Linux)"
license = "GPL-3.0-or-later"
repository = "https://github.com/Ultramarine-Linux/taidan"
readme = "../README.md"

[lib]
path = "./lib.rs"

[[bin]]
name = "taidan-helper"
path = "./bin/taidan-helper.rs"

[dependencies]
basic-toml = "0.1.10"
const_format = "0.2.37"
futures = { workspace = true }
itertools = { workspace = true }
phf = { version = "0.14.0", features = ["macros", "phf_macros"] }
regex = { workspace = true }
reqwest = { version = "0.13.5", features = [
  "native-tls",
  "socks",
], default-features = false }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = "1.0.154"
strum = { version = "0.28.0", features = ["derive"] }
taidan_proc_macros = { path = "../taidan_proc_macros" }
tempfile = { workspace = true }
thiserror = "2.0.21"
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
uzers = "0.12.2"
xcrypt = "0.3.2"

[dev-dependencies]
tokio = { workspace = true, features = ["net", "rt"] }
