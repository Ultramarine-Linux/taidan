# The server OOBE runs as this account. Tetra identifies it by UID on its local
# socket (/run/tetra/tetra.sock, root:tetra 0660), so it must be in the tetra
# group.
#
# The tetra group is also declared in tetra's own sysusers file. Declaring it
# here too, with the same fixed GID, keeps it at 241 whichever file
# systemd-sysusers reads first; an existing tetra group is left as it is.
g tetra 241
u ultramarine-oobe - "Ultramarine Server OOBE" /var/lib/ultramarine-server-oobe -
m ultramarine-oobe tetra
