<!doctype html>
<html lang="en" data-brand="ultramarine">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="/ultramarine-favicon.ico" sizes="any" />
		<link rel="icon" href="/ultramarine-favicon-32x32.png" type="image/png" sizes="32x32" />
		<link rel="icon" href="/ultramarine-favicon-16x16.png" type="image/png" sizes="16x16" />
		<link rel="apple-touch-icon" href="/ultramarine-apple-touch-icon.png" />
		<!-- Resolve theme and high contrast before first paint. Keep in sync with src/lib/appearance.svelte.ts. -->
		<script>
			'use strict';
			(() => {
				const root = document.documentElement;
				try {
					if (localStorage.getItem('oobe-theme') !== 'light') root.classList.add('dark');
					const contrast = localStorage.getItem('oobe-contrast');
					const more =
						contrast === 'on' ||
						(contrast !== 'off' && window.matchMedia('(prefers-contrast: more)').matches);
					if (more) root.setAttribute('data-contrast', 'more');
				} catch {
					root.classList.add('dark');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
