# service account for the Taidan OOBE/firstboot setup
#
# it has no password and can't log in. It only gets root (through pkexec) while
# taidan-initial-setup.service runs, which installs the polkit rules for that into
# /run/polkit-1/rules.d and removes them when it stops.
u taidan - "Taidan OOBE" /usr/lib/taidan /usr/sbin/nologin
