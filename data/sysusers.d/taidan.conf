# service account for the Taidan OOBE/firstboot setup
#
# it has no password and can't log in. it can only run /usr/libexec/taidan-helper as root
# (through pkexec) while taidan-initial-setup.service runs, which installs the polkit rules for
# that into /run/polkit-1/rules.d and removes them when it stops. the helper can make an admin, so
# anything running as taidan can get root while the OOBE runs. nothing untrusted may run as it.
u taidan - "Taidan OOBE" /usr/lib/taidan /usr/sbin/nologin
